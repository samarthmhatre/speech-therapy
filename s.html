<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Honey - S Words</title>
    <style>
        body {
            background-color: pink;
            font-family: Arial, sans-serif;
        }
        .container {
            text-align: center;
            padding-top: 50px;
            max-width: 600px;
            margin: 0 auto;
        }
        #random-word {
            color: #333;
            margin-top: 20px;
            font-size: 3em;
            min-height: 60px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin: 5px;
        }
        button:hover {
            background-color: #e0e0e0;
        }
        /* Recording specific styles */
        #record-btn { background-color: #ff6b6b; color: white; border: none; }
        #record-btn.recording { background-color: #cc0000; animation: pulse 1.5s infinite; }
        #result-area { margin-top: 20px; font-size: 1.2em; font-weight: bold; }
        .correct { color: green; }
        .incorrect { color: red; }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <a href="selection.html" style="font-size: 15px;">Back to Selection</a>
    <h1 style="text-align: center;">Practice 'S' Words</h1>
    
    <div class="container">
        <h2 id="random-word">Click 'Next Word' to start</h2>
        
        <div>
            <button onclick="displayRandomWord()">Next Word</button>
        </div>

        <div style="margin-top: 30px;">
            <button id="record-btn" onclick="toggleRecording()" disabled>Hold to Record</button>
            <p id="status-text" style="font-size: 0.9em; color: #666;">Select a word first</p>
        </div>

        <div id="result-area"></div>
    </div>

    <script>
        const wordList = [
            "sit", "soup", "salt", "seal", "sick", "sing", "sun", "save", "seed", "seat", 
            "city", "said", "sad", "sorry", "soap", "sock", "sail", "sour", "sign", "sand", 
            "soft", "seven", "sink", "son", "safe", "baseball", "dancer", "gasoline", 
            "grasshopper", "motorcycle", "fossil", "pencil", "muscle", "beside", "racing", 
            "insect", "recipe", "medicine", "listen", "glasses", "bicycle", "dinosaur", 
            "popsicle", "eraser", "faucet", "messy", "outside", "passing", "whistle", 
            "policeman", "bus", "face", "ice", "grass", "horse", "yes", "address", "office", 
            "purse", "glass", "pass", "voice", "nice", "lips", "class", "dress", "erase", 
            "house", "mouse", "race", "lettuce", "fence", "miss", "juice", "this", "scoop", 
            "scare", "scarf", "skirt", "scout", "scale", "skinny", "scar", "score", "skill", 
            "skip", "skull", "skunk", "scab", "skim", "school", "skin", "skate", "ski", 
            "sky", "slow", "sled", "slacker", "slam", "slab", "slave", "sleigh", "slick", 
            "slit", "slim", "sliver", "sludge", "slug", "slant", "slob", "sleeve", "sleep", 
            "slip", "slide", "slap", "smell", "smoke", "smog", "smear", "smooch", "smudge", 
            "smug", "smock", "smooth", "smack", "smite", "smoky", "smother", "smuggle", 
            "smart", "smash", "small", "smile", "sweep", "swallow", "swaddle", "swam", 
            "swap", "swarm", "swear", "swat", "sway", "swell", "swept", "swipe", "switch", 
            "sword", "swollen", "swamp", "swim", "swan", "swing", "sweater", "sweet", "sweat", 
            "snail", "snack", "snarl", "snatch", "snoop", "snot", "sneak", "snip", "snag", 
            "snob", "snuggle", "snooze", "sniffle", "snout", "snorkel", "snicker", "snitch", 
            "snowball", "snort", "snap", "snake", "sneeze", "snow", "snore", "spoon", "space", 
            "spy", "spare", "sponge", "sparkle", "spear", "spend", "spin", "spine", "spinach", 
            "spa", "spark", "speed", "Spanish", "speech", "spice", "spent", "special", "spider", 
            "speak", "spill", "spell", "sports", "stamp", "step", "stack", "stand", "stay", 
            "steal", "steer", "stitch", "still", "steam", "stone", "stop", "stem", "state", 
            "stick", "sting", "store", "stage", "steak", "start", "stir", "storm", "stuck", 
            "sticker", "star", "stairs", "story", "student"
        ];

        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        function speakText(text) {
            window.speechSynthesis.cancel(); // Stop any previous speech
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.9; // Optional: Adjust speed
            window.speechSynthesis.speak(utterance);
        }

        function displayRandomWord() {
            const randomIndex = Math.floor(Math.random() * wordList.length);
            document.getElementById('random-word').textContent = wordList[randomIndex];
            document.getElementById('record-btn').disabled = false;
            document.getElementById('record-btn').innerText = "Record Answer";
            document.getElementById('status-text').innerText = "Press to start recording";
            document.getElementById('result-area').innerHTML = "";
        }

        async function toggleRecording() {
            const recordBtn = document.getElementById('record-btn');
            const statusText = document.getElementById('status-text');

            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = sendAudioData;
                    mediaRecorder.start();
                    isRecording = true;
                    recordBtn.classList.add('recording');
                    recordBtn.innerText = "Stop Recording";
                    statusText.innerText = "Recording...";
                } catch (err) {
                    alert("Microphone access denied.");
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                recordBtn.classList.remove('recording');
                recordBtn.innerText = "Processing...";
                recordBtn.disabled = true;
            }
        }

        async function sendAudioData() {
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            const formData = new FormData();
            formData.append('audio', audioBlob, 'recording.webm');
            formData.append('target_word', document.getElementById('random-word').textContent);

            try {
                const response = await fetch('http://127.0.0.1:5000/transcribe', { method: 'POST', body: formData });
                const data = await response.json();
                const resultArea = document.getElementById('result-area');
                
                if (data.success) {
                    // Prepare the text to speak
                    const feedbackText = data.is_correct 
                        ? `Great job! You said ${data.transcription}` 
                        : `Try again. I heard ${data.transcription}`;

                    // Update UI
                    resultArea.innerHTML = data.is_correct 
                        ? `<span class="correct">${feedbackText}</span>` 
                        : `<span class="incorrect">${feedbackText}</span>`;
                    
                    // --- NEW: Speak the result ---
                    speakText(feedbackText);

                } else {
                    resultArea.innerText = "Error: " + (data.error || "Unknown Error");
                }
                
                document.getElementById('record-btn').innerText = "Record Answer";
                document.getElementById('record-btn').disabled = false;
                document.getElementById('status-text').innerText = "Ready";
            } catch (error) {
                console.error(error);
                document.getElementById('result-area').innerText = "Server Error";
                document.getElementById('record-btn').disabled = false;
            }
        }
    </script>
</body>
</html>
